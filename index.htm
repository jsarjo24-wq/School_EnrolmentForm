<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Enrollment Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 <div class="page-wrap">
    <!-- Page-header -->
     <header class="page-header">
       <div class="title-group">
        <div class="logo-mark">🎓</div>
        <h1>Student Enrollment Form</h1>
        <p class="subtitle">Ministry of Basic &amp; Secondary Education The Gambia</p>
       </div>

     </header>


<!-- Alert Box (shown by javaScrip) -->

<div id="alertBox" class="alert hidden"></div>
<form id="enrollForm" novalidate>
<!-- SECTION 1 -STUDENT PERSONAL INFORMATION -->
<fieldset class="card">
 <div class="section-head">
    <div class="card-head">👤 Student Personal Information</div>
 

 <div class="card-body">
    <!-- Passport Photo-->

        <div class="photo-info">
            <label for="passportPhoto">passport Photo</label>
            <input type="file" id="passportPhoto" name="passportPhoto" accept="image/jpeg.image/png">
            <span class="hint">JPG or PNG, max 2MB</span>
        </div>
     </div>

     <!-- Name row-->
      <div class="field-row-2">
        <div class="field">
            <label for="firstName">First Name<span class="req">*</span></label>
            <input type="text" id="firstName" name="firstName" placeholder="e.g. Sarjo" autocomplete="given-name">
        </div>
        <div class="field">
            <label for="middleName">Middle Name</label>
            <input type="text" id="middleName" name="middleName" placeholder="Optional" autocomplete="additional-name">
        </div>
      </div>

      <div class="field">
        <label for="lastName">Last Name / Surname<span class="req">*</span></label>
        <input type="text" id="lastName" placeholder="e.g. Jallow" autocomplete="family-name">
      </div>

      <div class="field">
        <label for="dateOfBirth">Date of Birth<span for="req">*</span></label>
        <input type="date" id="dateOfBirth" name="dateofBirth">
      </div>


        <!--Gender-->
     <div class="field">
        <label>Gender<span for="req">*</span></label>
        <div class="radio-group">
            <label><input type="radio" name="gender" value="Male" >Male</label>
            <label><input type="radio" name="gender" value="Female">Female</label>
        </div>
     </div>

     <div class="field">
        <label for="nationality">Nationality<span class="req">*</span></label>
        <select id="nationality" name="nationality">
            <option value="Gambian" selected>Gambian</option>
            <option value="Senegalese">Senegalese</option>
            <option value="Sierra Leonean">Sierra Leonean</option>
            <option value="Nigerian">Nigerian</option>
            <option value="Guinean">Guinean</option>
             <option value="Ghanaian">Ghanaian</option>
            <option value="Other African">Other African</option>
        </select>
     </div>
     
     <div class="field-row-2">
        <div class="field">
            <label for="placeOfBirth">Place of Birth</label>
            <input type="text" id="placeOfBirth" name="placeOfBirth" placeholder="e.g. Soma">
        </div>
        <div class="field">
            <label for="religion">Religion</label>
            <select id="religion" name="religion">
                <option value="">- Select -</option>
                <option value="Islam">Islam</option>
                <option value="Christianity">Christianity</option>
                <option value="Other">Other</option>
                <option value="prefer not to say">Prefer not to say</option>
            </select>
        </div>
     </div>



 </div><!--/card-body-->

</fieldset>

<!--Secton 2-- School & Class Placement-->
<fieldset class="card">
      <div class="card-head">🏫 School &amp; Class Placement</div>
<div class="card-body">
    <div class="field">
        <label for="region">Region<span class="req">*</span></label>
        <select id="region" name="region">
            <option value="">- Select Region -</option>
            <option value="Banjul">Banjul</option>
             <option value="Kanifing">Kanifing</option>
              <option value="West Cost Region">West Cost Region</option>
               <option value="Lower River Region">Lower River Region</option>
                <option value="Central River Region">Central River Region</option>
                 <option value="Upper River Region">Upper River Region</option>
                 <option value="North Bank Region">North Bank Region</option>
        </select>
    </div>

    <div class="field">
        <label for="schoolName">School Name<span class="req">*</span></label>
        <input type="text" id="schoolName" name="schoolName" placeholder="e.g. Soma Primary School">
    </div>

    <div class="field">
        <label for="schoolLevel">School Level<span class="req">*</span></label>
        <select id="schoolLevel" name="schoolLevel">
            <option value="">- Select -</option>
            <option value="Early Childhood">Early Childhood (Nursery)</option>
            <option value="Lower Basic">Lower Basic (Grade 1-6)</option>
            <option value="Upper Basic">Upper Basic (Grade 7-9)</option>
            <option value="Senior Secondary">Senior Secondary (Grade 10-12)</option>
        </select>
    </div>

    <div class="field">
        <label for="grade">Grade / Class <span class="req">*</span></label>
        <select id="grade" name="grade">
            <option value="">- Select -</option>
            <optgroup label="Lower Basic">
                <option value="Grade 1">Grade 1</option>
                <option value="Grade 2">Grade 2</option>
                <option value="Grade 3">Grade 3</option>
                <option value="Grade 4">Grade 4</option>
                <option value="Grade 5">Grade 5</option>
                <option value="Grade 6">Grade 6</option>
            </optgroup>
            <optgroup label="Upper Basic">
                <option value="Grade 7">Grade 7</option>
                <option value="Grade 8">Grade 8</option>
                <option value=" Grade 9">Grade 9</option>
            </optgroup>
            <optgroup label="Senior Secondary ">
                <option value="Grade 10 / Form 4">Grade 10 / Form 4</option>
                <option value="Grade 11 / Form 5">Grade 11 / Form 5</option>
                <option value="Grade 12 / Form 6">Grade 12 / Form 6</option>
            </optgroup>
        </select>
    </div>

    <div class="field-row-2">
        <div class="field">
            <label for="academicYear">Academic Year<span class="req">*</span></label>
            <select id="academicYear" name="academicYear">
                <option value="">- Select -</option>
                <option value="2024/2025">2024/2025</option>
                <option value="2025/2026">2025/2026</option>
                <option value="2026/2027" selected>2026/2027</option>
                <option value="2027/2028">2027/2028</option>
            </select>
        </div>
        <div class="field">
            <label for="enrollmentDate">Enrollment Date<span class="req">*</span></label>
            <input type="date" id="enrollmentDate" name="enrollmentDate">
        </div>
    </div>

    <div class="field">
        <label for="previousSchool">Previous School<span class="optional">(if transferring)</span></label>
        <input type="text" id="previousSchool" name="previousSchool" placeholder="Leave blank if new student">
    </div>

</div><!-- /card-body -->
    
</fieldset>

<!--SECTION 3- PARENT/ GUARDIAN INFORMATION-->

 <fieldset class="card">
         <div class="card-head">👨‍👩‍👧 Parent / Guardian Information</div>


  <div class="card-body">
    <div class="field">
        <label for="guardianName">Full Name<span class="req">*</span></label>
        <input type="text" id="guardianName" name="guardianName" placeholder="e.g. Ebrima Ceesay"/>

    </div>
    <div class="field">
        <label for="guardianRelationship">Relation to Student<span class="req">*</span></label>

        <select id="guardianRelationship" name="guardianRelationship">
            <option value="">— Select —</option>
            <option value="Father">Father</option>
            <option value="Mother">Mother</option>
            <option value="Guardian">Guardian</option>
            <option value="Uncle">Uncle</option>
            <option value="Aunt">Aunt</option>
            <option value="Grandparent">Grandparent</option>
            <option value="Sibling">Sibling</option>
            <option value="Other">Other</option>
          </select>
    </div>

    <div class="field">
        <label for="guardianPhone">Phone Number<span class="req">*</span></label>
        <input type="tel" id="guardianPhone" name="guardianPhone" placeholder="e.g. 3201234" maxlength="7" inputmode="numeric">
        <span class="hint">Gambia number, 7 digits</span>
    </div>

    <div class="field">
        <label for="guardianOccupation">Occupation</label>
        <input type="text" id="guardianOccupation" name="guardianOccupation" placeholder="e.g. Trade">

    </div>

    <div class="field">
        <label for="guardianAddress">Home Address<span class="req">*</span></label>
        <input type="text" id="guardianAddress" name="guardianAddress" placeholder="Compound / stress, town, region">
    </div>

  </div>  <!--/card-body-->  

</fieldset>


<!-- SECTION- HEALTH & ADDITIONAL NOTES-->


<fieldset class="card">
      <div class="section-head">
       
        <span>Health &amp; Additional Notes</span>
      </div>
 
      <div class="card-body">
 
        <div class="field-row-2">
          <div class="field">
            <label for="bloodGroup">Blood Group</label>
            <select id="bloodGroup" name="bloodGroup">
              <option value="Unknown" selected>— Unknown —</option>
              <option value="A+">A+</option>
              <option value="A-">A−</option>
              <option value="B+">B+</option>
              <option value="B-">B−</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB−</option>
              <option value="O+">O+</option>
              <option value="O-">O−</option>
            </select>
          </div>
          <div class="field">
            <label for="disability">Any Disability / Special Need</label>
            <select id="disability" name="disability">
              <option value="None" selected>None</option>
              <option value="Visual Impairment">Visual Impairment</option>
              <option value="Hearing Impairment">Hearing Impairment</option>
              <option value="Physical Disability">Physical Disability</option>
              <option value="Learning Difficulty">Learning Difficulty</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
 
        <div class="field">
          <label for="medicalConditions">Medical Conditions / Allergies</label>
          <textarea id="medicalConditions" name="medicalConditions" placeholder="Note any conditions the school should know about…"></textarea>
        </div>
 
        <div class="field">
          <label for="additionalNotes">Additional Notes</label>
          <textarea id="additionalNotes" name="additionalNotes" placeholder="Any other relevant information…"></textarea>
        </div>
 
      </div><!-- /card-body -->
    </fieldset>
 
 
    <!-- ══════════════════════════════════════════════════════════════════
         FOOTER ACTIONS
    ══════════════════════════════════════════════════════════════════ -->
    <div class="actions-card">
      <p class="req-note">Fields marked <span class="req">*</span> are required.</p>
      <div class="btn-row">
        <button type="button" id="clearBtn" class="btn-clear">Clear Form</button>
        <button type="submit" id="submitBtn" class="btn-enroll">Enroll Student</button>
      </div>
    </div>
 


</form>

 </div><!--/page-wrap-->

 

    <script src="script.js"></script>
</body>
</html>
